[package]
name = "todaynote"
version = "0.1.0"
description = "A Tauri App"
authors = ["Stefan Bamberger"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "todaynote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
chrono = { version = "0.4.45", features = ["serde", "unstable-locales"] }
dirs = "6.0.0"
include_dir = "0.7.4"
nucleo-matcher = "0.3.1"
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22.0.0"

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <=0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
] }

